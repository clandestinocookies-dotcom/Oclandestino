// ---------- Auth (Supabase Auth REST, sem lib externa) ----------
const authBase = `${SUPABASE_URL}/auth/v1`;
async function signUp(email, password) {
  const r = await fetch(`${authBase}/signup`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.msg || data.error_description || "Erro ao cadastrar.");
  return data;
}
async function signIn(email, password) {
  const r = await fetch(`${authBase}/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.msg || data.error_description || "E-mail ou senha inválidos.");
  return data;
}

// ---------- Cliente REST por tabela, autenticado com o token do usuário ----------
function makeTableClient(accessToken, table) {
  const base = `${SUPABASE_URL}/rest/v1/${table}`;
  const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" };
  return {
    async list(order = "id.desc") {
      const r = await fetch(`${base}?select=*&order=${order}`, { headers });
      if (!r.ok) throw new Error(`${table}: erro ao listar (${r.status})`);
      return r.json();
    },
    async insert(row) {
      const r = await fetch(base, { method: "POST", headers: { ...headers, Prefer: "return=representation" }, body: JSON.stringify(row) });
      if (!r.ok) throw new Error(`${table}: erro ao salvar (${r.status})`);
      return r.json();
    },
    async update(id, patch) {
      const r = await fetch(`${base}?id=eq.${id}`, { method: "PATCH", headers: { ...headers, Prefer: "return=representation" }, body: JSON.stringify(patch) });
      if (!r.ok) throw new Error(`${table}: erro ao atualizar (${r.status})`);
      return r.json();
    },
    async remove(id) {
      const r = await fetch(`${base}?id=eq.${id}`, { method: "DELETE", headers });
      if (!r.ok) throw new Error(`${table}: erro ao excluir (${r.status})`);
    },
  };
}

function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState("login");

  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);

  const [info, setInfo] = useState("");

  async function submit(e) {
    e.preventDefault();
    setError(""); setInfo(""); setBusy(true);
    try {
      if (mode === "login") {
        const session = await signIn(email, password);
        onAuthed(session);
      } else {
        await signUp(email, password);
        setInfo("Conta criada! Verifica teu e-mail se a confirmação estiver ativa, ou já entra abaixo.");
        setMode("login");
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: "#F8FAFC", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Poppins', system-ui, sans-serif", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 380, background: "#FFFFFF", border: "1px solid #E2E8F0", borderRadius: 16, padding: 28, boxShadow: "0 1px 2px rgba(15,23,42,0.04)" }}>

        )}
        {info && (
          <div style={{ display: "flex", gap: 8, alignItems: "center", background: "#F0FDF4", color: "#15803D", border: "1px solid #86EFAC", borderRadius: 10, padding: "10px 12px", fontSize: 13, marginBottom: 14 }}>

        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>

          </div>
          <button type="submit" disabled={busy} style={{ ...primaryBtn2, width: "100%", justifyContent: "center", display: "flex", alignItems: "center", gap: 8, opacity: busy ? 0.7 : 1 }}>
            {busy && <Loader2 size={14} extra={{ className: "animate-spin" }} />}

        </form>

        <button onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); setInfo(""); }} style={{ background: "none", border: "none", color: "#4F46E5", fontSize: 13, cursor: "pointer", marginTop: 16, width: "100%" }}>
          {mode === "login" ? "Não tem conta? Cadastra aqui" : "Já tem conta? Entra aqui"}

function FinanceTracker() {
  const [session, setSession] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);
  const [tab, setTab] = useState("dashboard");
  const [menuOpen, setMenuOpen] = useState(false);
  const [loading, setLoading] = useState(false);
  const [status, setStatus] = useState(null);

  const [entries, setEntries] = useState([]);
  const [accounts, setAccounts] = useState([]);
  const [loans, setLoans] = useState([]);
  const [investments, setInvestments] = useState([]);

  const [form, setForm] = useState({ type: "expense", desc: "", amount: "", category: CATEGORIES.expense[0] });
  const [accForm, setAccForm] = useState({ name: "", type: ACCOUNT_TYPES[0], balance: "" });
  const [loanForm, setLoanForm] = useState({ name: "", total: "", installments: "", paid: "", installmentValue: "" });
  const [invForm, setInvForm] = useState({ name: "", type: INVEST_TYPES[0], invested: "", current: "" });
  const [monthFilter, setMonthFilter] = useState(new Date().toISOString().slice(0, 7));

  const clients = useMemo(() => session ? {
    entries: makeTableClient(session.access_token, "entries"),
    accounts: makeTableClient(session.access_token, "accounts"),
    loans: makeTableClient(session.access_token, "loans"),
    investments: makeTableClient(session.access_token, "investments"),
  } : null, [session]);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("finance_session");
      if (raw) setSession(JSON.parse(raw));
    } catch (e) {}
    setCheckingSession(false);
  }, []);

  function handleAuthed(newSession) {
    try { localStorage.setItem("finance_session", JSON.stringify(newSession)); } catch (e) {}
    setSession(newSession);
  }
  function logout() {
    try { localStorage.removeItem("finance_session"); } catch (e) {}
    setSession(null);
    setEntries([]); setAccounts([]); setLoans([]); setInvestments([]);
  }

  useEffect(() => {
    if (!clients) return;
    (async () => {
      setLoading(true);
      try {
        const [rawEntries, rawAccounts, rawLoans, rawInvestments] = await Promise.all([
          clients.entries.list("date.desc"), clients.accounts.list(), clients.loans.list(), clients.investments.list(),
        ]);
        setEntries(rawEntries.map((r) => ({ ...r, desc: r.desc ?? r.description })));
        setAccounts(rawAccounts);
        setLoans(rawLoans.map((l) => ({ ...l, installmentValue: l.installment_value })));
        setInvestments(rawInvestments.map((i) => ({ ...i, current: i.current_value })));
      } catch (e) {
        setStatus({ type: "error", text: "Sessão expirou ou erro de conexão. Entra de novo." });
        logout();
      } finally {
        setLoading(false);
      }
    })();
  }, [clients]);

  async function addEntry(e) {
    e.preventDefault();
    const amount = parseFloat(String(form.amount).replace(",", "."));
    if (!form.desc.trim() || !amount || amount <= 0) return;
    try {
      const [saved] = await clients.entries.insert({ type: form.type, description: form.desc.trim(), amount, category: form.category, date: new Date().toISOString() });
      setEntries((prev) => [{ ...saved, desc: saved.desc ?? saved.description }, ...prev]);
      setForm({ type: form.type, desc: "", amount: "", category: CATEGORIES[form.type][0] });
    } catch (err) { setStatus({ type: "error", text: err.message }); }
  }
  async function removeEntry(id) {
    try { await clients.entries.remove(id); setEntries((prev) => prev.filter((e) => e.id !== id)); }
    catch (err) { setStatus({ type: "error", text: err.message }); }
  }

  async function addAccount(e) {
    e.preventDefault();
    const balance = parseFloat(String(accForm.balance).replace(",", "."));
    if (!accForm.name.trim() || isNaN(balance)) return;
    try {
      const [saved] = await clients.accounts.insert({ name: accForm.name.trim(), type: accForm.type, balance });
      setAccounts((prev) => [saved, ...prev]);
      setAccForm({ name: "", type: accForm.type, balance: "" });
    } catch (err) { setStatus({ type: "error", text: err.message }); }
  }
  async function removeAccount(id) {
    try { await clients.accounts.remove(id); setAccounts((prev) => prev.filter((a) => a.id !== id)); }
    catch (err) { setStatus({ type: "error", text: err.message }); }
  }

  async function addLoan(e) {
    e.preventDefault();
    const total = parseFloat(String(loanForm.total).replace(",", "."));
    const installments = parseInt(loanForm.installments, 10);
    const paid = parseInt(loanForm.paid || "0", 10);
    const installmentValue = parseFloat(String(loanForm.installmentValue).replace(",", "."));
    if (!loanForm.name.trim() || !installments || !installmentValue) return;
    try {
      const [saved] = await clients.loans.insert({ name: loanForm.name.trim(), total: total || installmentValue * installments, installments, paid: paid || 0, installment_value: installmentValue });
      setLoans((prev) => [{ ...saved, installmentValue: saved.installment_value }, ...prev]);
      setLoanForm({ name: "", total: "", installments: "", paid: "", installmentValue: "" });
    } catch (err) { setStatus({ type: "error", text: err.message }); }
  }
  async function bumpLoan(id, delta) {
    const loan = loans.find((l) => l.id === id);
    if (!loan) return;
    const paid = Math.max(0, Math.min(loan.installments, loan.paid + delta));
    try {
      await clients.loans.update(id, { paid });
      setLoans((prev) => prev.map((l) => l.id === id ? { ...l, paid } : l));
    } catch (err) { setStatus({ type: "error", text: err.message }); }
  }
  async function removeLoan(id) {
    try { await clients.loans.remove(id); setLoans((prev) => prev.filter((l) => l.id !== id)); }
    catch (err) { setStatus({ type: "error", text: err.message }); }
  }

  async function addInvestment(e) {
    e.preventDefault();
    const invested = parseFloat(String(invForm.invested).replace(",", "."));
    const current = parseFloat(String(invForm.current).replace(",", "."));
    if (!invForm.name.trim() || isNaN(invested)) return;
    try {
      const [saved] = await clients.investments.insert({ name: invForm.name.trim(), type: invForm.type, invested, current_value: isNaN(current) ? invested : current });
      setInvestments((prev) => [{ ...saved, current: saved.current_value }, ...prev]);
      setInvForm({ name: "", type: invForm.type, invested: "", current: "" });
    } catch (err) { setStatus({ type: "error", text: err.message }); }
  }
  async function removeInvestment(id) {
    try { await clients.investments.remove(id); setInvestments((prev) => prev.filter((i) => i.id !== id)); }
    catch (err) { setStatus({ type: "error", text: err.message }); }
  }

  const monthEntries = useMemo(() => entries.filter((e) => (e.date || "").slice(0, 7) === monthFilter), [entries, monthFilter]);
  const totals = useMemo(() => {
    const income = monthEntries.filter((e) => e.type === "income").reduce((s, e) => s + Number(e.amount), 0);
    const expense = monthEntries.filter((e) => e.type === "expense").reduce((s, e) => s + Number(e.amount), 0);
    return { income, expense, balance: income - expense };
  }, [monthEntries]);
  const pieData = useMemo(() => {
    const byCat = {};
    monthEntries.filter((e) => e.type === "expense").forEach((e) => { byCat[e.category] = (byCat[e.category] || 0) + Number(e.amount); });
    return Object.entries(byCat).map(([name, value]) => ({ name, value }));
  }, [monthEntries]);
  const barData = useMemo(() => {
    const byMonth = {};
    entries.forEach((e) => {
      const m = (e.date || "").slice(0, 7); if (!m) return;
      if (!byMonth[m]) byMonth[m] = { month: m, income: 0, expense: 0 };
      byMonth[m][e.type] += Number(e.amount);
    });
    return Object.values(byMonth).sort((a, b) => a.month.localeCompare(b.month)).slice(-6);
  }, [entries]);

  const accountsTotal = useMemo(() => accounts.reduce((s, a) => s + Number(a.balance), 0), [accounts]);
  const loansRemaining = useMemo(() => loans.reduce((s, l) => s + (l.installments - l.paid) * l.installmentValue, 0), [loans]);
  const investedTotal = useMemo(() => investments.reduce((s, i) => s + Number(i.invested), 0), [investments]);
  const investCurrentTotal = useMemo(() => investments.reduce((s, i) => s + Number(i.current), 0), [investments]);
  const netWorth = accountsTotal + investCurrentTotal - loansRemaining;

  if (checkingSession) {
    return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", color: "#64748B", fontFamily: "'Poppins', system-ui, sans-serif" }}><Loader2 extra={{ className: "animate-spin" }} size={20} /></div>;
  }
  if (!session) {
    return <AuthScreen onAuthed={handleAuthed} />;
  }

  return (
    <div style={{ fontFamily: "'Poppins', system-ui, sans-serif", background: "#F8FAFC", minHeight: "100vh", color: "#0F172A" }}>
      <div style={{ display: "flex", minHeight: "100vh" }}>
        <aside style={{ width: menuOpen ? 230 : 0, overflow: "hidden", transition: "width .2s ease", borderRight: menuOpen ? "1px solid #E2E8F0" : "none", background: "#FFFFFF", flexShrink: 0 }}>
          <div style={{ padding: 20, width: 230, display: "flex", flexDirection: "column", height: "100%" }}>
            <div style={{ fontWeight: 800, fontSize: 17, marginBottom: 28, display: "flex", alignItems: "center", gap: 8 }}>
              <Wallet size={20} color="#4F46E5" /> Finanças
            </div>
            {TABS.map((t) => {
              const IconC = t.icon; const active = tab === t.id;
              return (
                <button key={t.id} className="btn-tab" onClick={() => { setTab(t.id); setMenuOpen(false); }}
                  style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "10px 12px", marginBottom: 6, borderRadius: 10, border: "none",
                    background: active ? "#4F46E5" : "transparent", color: active ? "#fff" : "#475569", fontSize: 14, fontWeight: 600, cursor: "pointer", textAlign: "left" }}>
                  <IconC size={16} /> {t.label}
                </button>
              );
            })}
            <div style={{ marginTop: 12, padding: "12px", borderRadius: 10, background: "#EEF2FF", fontSize: 12, color: "#3730A3" }}>
              <div style={{ fontWeight: 700, marginBottom: 2 }}>Patrimônio líquido</div>
              <div style={{ fontSize: 16, fontWeight: 800 }}>{fmt(netWorth)}</div>
            </div>
            <div style={{ marginTop: "auto", paddingTop: 16, borderTop: "1px solid #F1F5F9" }}>
              <div style={{ fontSize: 11.5, color: "#94A3B8", marginBottom: 8, wordBreak: "break-all" }}>{session.user?.email}</div>
              <button onClick={logout} style={{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "1px solid #E2E8F0", borderRadius: 8, padding: "8px 10px", fontSize: 13, color: "#64748B", cursor: "pointer", width: "100%" }}>
                <LogOut size={14} /> Sair
              </button>
            </div>
          </div>
        </aside>

        <main style={{ flex: 1, padding: "20px 28px", maxWidth: 1040 }}>
          <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <button onClick={() => setMenuOpen((o) => !o)} style={{ background: "#FFFFFF", border: "1px solid #E2E8F0", borderRadius: 8, padding: 8, cursor: "pointer", color: "#0F172A" }}>
                {menuOpen ? <X size={16} /> : <Menu size={16} />}
              </button>
              <h1 style={{ fontSize: 22, margin: 0, fontWeight: 800 }}>{TABS.find((t) => t.id === tab)?.label}</h1>
            </div>
            {(tab === "dashboard" || tab === "entries") && (
              <input type="month" value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)}
                style={{ background: "#FFFFFF", border: "1px solid #E2E8F0", borderRadius: 8, padding: "8px 12px", color: "#0F172A", fontSize: 13 }} />
            )}
          </header>

          {status && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", borderRadius: 10, marginBottom: 20, fontSize: 13,
              background: status.type === "error" ? "#FEF2F2" : "#F0FDF4",
              color: status.type === "error" ? "#B91C1C" : "#15803D",
              border: `1px solid ${status.type === "error" ? "#FCA5A5" : "#86EFAC"}` }}>
              {status.type === "error" ? <AlertCircle size={15} /> : <CheckCircle2 size={15} />} {status.text}
            </div>
          )}

          {loading ? (
            <div style={{ display: "flex", alignItems: "center", gap: 8, color: "#64748B", padding: "40px 0", justifyContent: "center" }}>
              <Loader2 extra={{ className: "animate-spin" }} size={18} /> Carregando dados...
            </div>
          ) : (
            <>
              {tab === "dashboard" && (
                <>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, marginBottom: 14 }}>
                    <SummaryCard icon={<TrendingUp size={18} color="#16A34A" />} label="Entradas do mês" value={fmt(totals.income)} accent="#16A34A" />
                    <SummaryCard icon={<TrendingDown size={18} color="#DC2626" />} label="Saídas do mês" value={fmt(totals.expense)} accent="#DC2626" />
                    <SummaryCard icon={<Wallet size={18} color="#4F46E5" />} label="Saldo do mês" value={fmt(totals.balance)} accent={totals.balance < 0 ? "#DC2626" : "#4F46E5"} />
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, marginBottom: 20 }}>
                    <SummaryCard icon={<Landmark size={18} color="#0891B2" />} label="Em contas/caixa" value={fmt(accountsTotal)} accent="#0891B2" />
                    <SummaryCard icon={<CreditCard size={18} color="#F59E0B" />} label="Financiamentos (falta)" value={fmt(loansRemaining)} accent="#F59E0B" />
                    <SummaryCard icon={<LineChartIcon size={18} color="#9333EA" />} label="Investido (atual)" value={fmt(investCurrentTotal)} accent="#9333EA" />
                  </div>

                  <form onSubmit={addEntry} className="card" style={{ padding: 18, marginBottom: 20 }}>
                    <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                      {["expense", "income"].map((t) => (
                        <button type="button" key={t} onClick={() => setForm((f) => ({ ...f, type: t, category: CATEGORIES[t][0] }))}
                          style={{ flex: 1, padding: "9px 0", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700,
                            border: "1px solid " + (form.type === t ? (t === "expense" ? "#DC2626" : "#16A34A") : "#E2E8F0"),
                            background: form.type === t ? (t === "expense" ? "#FEF2F2" : "#F0FDF4") : "#FFFFFF",
                            color: form.type === t ? (t === "expense" ? "#B91C1C" : "#15803D") : "#64748B" }}>
                          {t === "expense" ? "Saída" : "Entrada"}
                        </button>
                      ))}
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr auto", gap: 8 }}>
                      <input placeholder="Descrição" value={form.desc} onChange={(e) => setForm((f) => ({ ...f, desc: e.target.value }))} style={inputStyle} />
                      <input placeholder="Valor (R$)" inputMode="decimal" value={form.amount} onChange={(e) => setForm((f) => ({ ...f, amount: e.target.value }))} style={inputStyle} />
                      <select value={form.category} onChange={(e) => setForm((f) => ({ ...f, category: e.target.value }))} style={inputStyle}>
                        {CATEGORIES[form.type].map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                      <button type="submit" style={primaryBtn}><Plus size={18} /></button>
                    </div>
                  </form>

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                    <div className="card" style={{ padding: 18 }}>
                      <h3 style={chartTitle}>Gastos por categoria</h3>
                      {pieData.length === 0 ? <EmptyNote text="Sem saídas neste mês" /> : (
                        <ResponsiveContainer width="100%" height={220}>
                          <PieChart>
                            <Pie data={pieData} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={80} label={(d) => d.name}>
                              {pieData.map((_, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}
                            </Pie>
                            <Tooltip formatter={(v) => fmt(v)} contentStyle={{ background: "#fff", border: "1px solid #E2E8F0", borderRadius: 8 }} />
                          </PieChart>
                        </ResponsiveContainer>
                      )}
                    </div>
                    <div className="card" style={{ padding: 18 }}>
                      <h3 style={chartTitle}>Últimos 6 meses</h3>
                      {barData.length === 0 ? <EmptyNote text="Sem histórico ainda" /> : (
                        <ResponsiveContainer width="100%" height={220}>
                          <BarChart data={barData}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#E2E8F0" />
                            <XAxis dataKey="month" tick={{ fontSize: 11, fill: "#64748B" }} />
                            <YAxis tick={{ fontSize: 11, fill: "#64748B" }} />
                            <Tooltip formatter={(v) => fmt(v)} contentStyle={{ background: "#fff", border: "1px solid #E2E8F0", borderRadius: 8 }} />
                            <Bar dataKey="income" fill="#16A34A" radius={[4, 4, 0, 0]} />
                            <Bar dataKey="expense" fill="#DC2626" radius={[4, 4, 0, 0]} />
                          </BarChart>
                        </ResponsiveContainer>
                      )}
                    </div>
                  </div>
                </>
              )}

              {tab === "entries" && (
                <div className="card" style={{ padding: 18 }}>
                  <h3 style={chartTitle}>Lançamentos do mês</h3>
                  {monthEntries.length === 0 ? <EmptyNote text="Nada por aqui ainda." /> : (
                    monthEntries.map((e) => (
                      <div key={e.id} className="row-hover" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 8px", borderRadius: 8, borderBottom: "1px solid #F1F5F9" }}>
                        <div>
                          <div style={{ fontSize: 14, fontWeight: 600 }}>{e.desc}</div>
                          <div style={{ fontSize: 12, color: "#64748B" }}>{e.category} · {new Date(e.date).toLocaleDateString("pt-BR")}</div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <span style={{ fontWeight: 700, color: e.type === "income" ? "#16A34A" : "#DC2626" }}>{e.type === "income" ? "+" : "-"}{fmt(Number(e.amount))}</span>
                          <button onClick={() => removeEntry(e.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#94A3B8" }}><Trash2 size={16} /></button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {tab === "accounts" && (
                <>
                  <form onSubmit={addAccount} className="card" style={{ padding: 18, marginBottom: 18 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "2fr 1.4fr 1fr auto", gap: 8 }}>
                      <input placeholder="Nome (ex: Nubank)" value={accForm.name} onChange={(e) => setAccForm((f) => ({ ...f, name: e.target.value }))} style={inputStyle} />
                      <select value={accForm.type} onChange={(e) => setAccForm((f) => ({ ...f, type: e.target.value }))} style={inputStyle}>
                        {ACCOUNT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                      </select>
                      <input placeholder="Saldo (R$)" inputMode="decimal" value={accForm.balance} onChange={(e) => setAccForm((f) => ({ ...f, balance: e.target.value }))} style={inputStyle} />
                      <button type="submit" style={primaryBtn}><Plus size={18} /></button>
                    </div>
                  </form>
                  <div className="card" style={{ padding: 18 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                      <h3 style={chartTitle}>Contas & caixa</h3>
                      <span style={{ fontWeight: 800 }}>{fmt(accountsTotal)}</span>
                    </div>
                    {accounts.length === 0 ? <EmptyNote text="Nenhuma conta cadastrada." /> : accounts.map((a) => (
                      <div key={a.id} className="row-hover" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 8px", borderRadius: 8, borderBottom: "1px solid #F1F5F9" }}>
                        <div>
                          <div style={{ fontSize: 14, fontWeight: 600 }}>{a.name}</div>
                          <div style={{ fontSize: 12, color: "#64748B" }}>{a.type}</div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <span style={{ fontWeight: 700, color: "#0891B2" }}>{fmt(a.balance)}</span>
                          <button onClick={() => removeAccount(a.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#94A3B8" }}><Trash2 size={16} /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {tab === "loans" && (
                <>
                  <form onSubmit={addLoan} className="card" style={{ padding: 18, marginBottom: 18 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr auto", gap: 8, marginBottom: 8 }}>
                      <input placeholder="Nome (ex: Financiamento carro)" value={loanForm.name} onChange={(e) => setLoanForm((f) => ({ ...f, name: e.target.value }))} style={inputStyle} />
                      <input placeholder="Nº parcelas" inputMode="numeric" value={loanForm.installments} onChange={(e) => setLoanForm((f) => ({ ...f, installments: e.target.value }))} style={inputStyle} />
                      <input placeholder="Já pagas" inputMode="numeric" value={loanForm.paid} onChange={(e) => setLoanForm((f) => ({ ...f, paid: e.target.value }))} style={inputStyle} />
                      <input placeholder="Valor da parcela" inputMode="decimal" value={loanForm.installmentValue} onChange={(e) => setLoanForm((f) => ({ ...f, installmentValue: e.target.value }))} style={inputStyle} />
                      <button type="submit" style={primaryBtn}><Plus size={18} /></button>
                    </div>
                  </form>
                  <div className="card" style={{ padding: 18 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                      <h3 style={chartTitle}>Financiamentos</h3>
                      <span style={{ fontWeight: 800, color: "#F59E0B" }}>Falta pagar: {fmt(loansRemaining)}</span>
                    </div>
                    {loans.length === 0 ? <EmptyNote text="Nenhum financiamento cadastrado." /> : loans.map((l) => {
                      const pct = Math.round((l.paid / l.installments) * 100);
                      const remaining = (l.installments - l.paid) * l.installmentValue;
                      return (
                        <div key={l.id} style={{ padding: "12px 8px", borderBottom: "1px solid #F1F5F9" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                            <div>
                              <div style={{ fontSize: 14, fontWeight: 600 }}>{l.name}</div>
                              <div style={{ fontSize: 12, color: "#64748B" }}>{l.paid}/{l.installments} parcelas · {fmt(l.installmentValue)} cada</div>
                            </div>
                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                              <span style={{ fontWeight: 700, color: "#F59E0B" }}>{fmt(remaining)}</span>
                              <button onClick={() => removeLoan(l.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#94A3B8" }}><Trash2 size={16} /></button>
                            </div>
                          </div>
                          <div className="progress-bg" style={{ height: 8, borderRadius: 6, overflow: "hidden", marginBottom: 6 }}>
                            <div style={{ height: "100%", width: `${pct}%`, background: "#4F46E5", borderRadius: 6 }} />
                          </div>
                          <div style={{ display: "flex", gap: 8 }}>
                            <button onClick={() => bumpLoan(l.id, 1)} style={smallBtn}>+1 parcela paga</button>
                            <button onClick={() => bumpLoan(l.id, -1)} style={smallBtnGhost}>-1</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              {tab === "investments" && (
                <>
                  <form onSubmit={addInvestment} className="card" style={{ padding: 18, marginBottom: 18 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "2fr 1.4fr 1fr 1fr auto", gap: 8 }}>
                      <input placeholder="Nome (ex: Tesouro Selic)" value={invForm.name} onChange={(e) => setInvForm((f) => ({ ...f, name: e.target.value }))} style={inputStyle} />
                      <select value={invForm.type} onChange={(e) => setInvForm((f) => ({ ...f, type: e.target.value }))} style={inputStyle}>
                        {INVEST_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                      </select>
                      <input placeholder="Valor investido" inputMode="decimal" value={invForm.invested} onChange={(e) => setInvForm((f) => ({ ...f, invested: e.target.value }))} style={inputStyle} />
                      <input placeholder="Valor atual" inputMode="decimal" value={invForm.current} onChange={(e) => setInvForm((f) => ({ ...f, current: e.target.value }))} style={inputStyle} />
                      <button type="submit" style={primaryBtn}><Plus size={18} /></button>
                    </div>
                  </form>
                  <div className="card" style={{ padding: 18 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                      <h3 style={chartTitle}>Investimentos</h3>
                      <span style={{ fontWeight: 800, color: investCurrentTotal - investedTotal >= 0 ? "#16A34A" : "#DC2626" }}>
                        {investCurrentTotal - investedTotal >= 0 ? "+" : ""}{fmt(investCurrentTotal - investedTotal)}
                      </span>
                    </div>
                    {investments.length === 0 ? <EmptyNote text="Nenhum investimento cadastrado." /> : investments.map((i) => {
                      const gain = i.current - i.invested;
                      const gainPct = i.invested ? ((gain / i.invested) * 100).toFixed(1) : "0.0";
                      return (
                        <div key={i.id} className="row-hover" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 8px", borderRadius: 8, borderBottom: "1px solid #F1F5F9" }}>
                          <div>
                            <div style={{ fontSize: 14, fontWeight: 600 }}>{i.name}</div>
                            <div style={{ fontSize: 12, color: "#64748B" }}>{i.type} · investido {fmt(i.invested)}</div>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                            <div style={{ textAlign: "right" }}>
                              <div style={{ fontWeight: 700 }}>{fmt(i.current)}</div>
                              <div style={{ fontSize: 12, color: gain >= 0 ? "#16A34A" : "#DC2626" }}>{gain >= 0 ? "+" : ""}{gainPct}%</div>
                            </div>
                            <button onClick={() => removeInvestment(i.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#94A3B8" }}><Trash2 size={16} /></button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </>
          )}
        </main>
      </div>
    </div>
  );
}

function SummaryCard({ icon, label, value, accent }) {
  return (
    <div className="card" style={{ padding: 16, borderTop: `2px solid ${accent}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#64748B", marginBottom: 8 }}>{icon} {label}</div>
      <div style={{ fontSize: 20, fontWeight: 800 }}>{value}</div>
    </div>
  );
}
function EmptyNote({ text }) {
  return <div style={{ fontSize: 13, color: "#94A3B8", padding: "24px 0", textAlign: "center" }}>{text}</div>;
}

const inputStyle = { background: "#F8FAFC", border: "1px solid #E2E8F0", borderRadius: 8, padding: "9px 11px", fontSize: 13.5, color: "#0F172A" };
const primaryBtn = { background: "#4F46E5", color: "#fff", border: "none", borderRadius: 10, padding: "0 16px", cursor: "pointer", display: "flex", alignItems: "center" };
const primaryBtn2 = { background: "#4F46E5", color: "#fff", border: "none", borderRadius: 10, padding: "10px 16px", cursor: "pointer", fontWeight: 700, fontSize: 13 };
const chartTitle = { fontSize: 13, fontWeight: 700, margin: "0 0 12px", color: "#475569" };
const smallBtn = { background: "#EEF2FF", color: "#4338CA", border: "none", borderRadius: 8, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" };
const smallBtnGhost = { background: "#F1F5F9", color: "#64748B", border: "none", borderRadius: 8, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" };

ReactDOM.createRoot(document.getElementById("root")).render(<FinanceTracker />);
</script>
</body>
</html>
